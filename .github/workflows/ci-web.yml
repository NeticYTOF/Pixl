name: CI — Web Apps

on:
  push:
    paths:
      - "apps/dashboard/**"
      - "apps/landing/**"
      - "apps/server/**"
      - "apps/pixorpheus/**"
      - "apps/pixo-dm/**"
      - "bun.lock"
      - "package.json"
      - "turbo.json"
    branches: [main]
  pull_request:
    paths:
      - "apps/dashboard/**"
      - "apps/landing/**"
      - "apps/server/**"
      - "bun.lock"
      - "package.json"
      - "turbo.json"
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-typecheck:
    name: Build & TypeCheck
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.13"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: TypeCheck dashboard
        working-directory: apps/dashboard
        run: bunx tsc --noEmit

      - name: TypeCheck landing
        working-directory: apps/landing
        run: bunx tsc --noEmit

      - name: TypeCheck server
        working-directory: apps/server
        run: bunx tsc --noEmit

      - name: Build all (turbo)
        run: bun run build
